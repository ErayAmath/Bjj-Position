[project]
name = "bjj-positions"
version = "0.1.0"
description = "Recognise Brazilian Jiu-Jitsu positions from pose keypoints and derive training statistics."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Video pipeline: person detection + pose estimation (RTMPose via ONNX Runtime, Apache-2.0).
pipeline = ["rtmlib>=0.0.16", "onnxruntime>=1.24", "opencv-python>=4.10"]
# torch is installed separately (CUDA wheel index), see README.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
